# Every Monday, checks whether the skills lag what they document: a newer
# @taxbit/react-sdk on npm, or an API spec change in readme-apidocs. Opens one
# issue saying what to regenerate (or updates it), and closes it once both
# checks pass. See scripts/check-for-updates.mjs.
#
# The API check needs the APIDOCS_TOKEN secret: a token that can read
# taxbit-private/readme-apidocs. Without it only the React SDK is checked.
# Runs only in this public repo, not in the private mirror.
name: Check for updates

on:
  schedule:
    - cron: '0 16 * * 1' # Mondays, 16:00 UTC (9:00 PDT / 8:00 PST)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.repository == 'taxbit-shared/taxbit-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the skills against npm and the API spec
        run: node scripts/check-for-updates.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          APIDOCS_TOKEN: ${{ secrets.APIDOCS_TOKEN }}
